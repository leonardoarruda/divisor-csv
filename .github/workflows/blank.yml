name: Gerar Executavel Windows

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permite rodar manualmente clicando em um botão

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compilar o script em .exe
      run: |
        if (Test-Path "Conversor.py") { pyinstaller --noconsole --onefile Conversor.py }
        else { pyinstaller --noconsole --onefile conversor.py }

    - name: Guardar o arquivo .exe pronto
      uses: actions/upload-artifact@v4
      with:
        name: conversor-windows-exe
        path: dist/conversor.exe
