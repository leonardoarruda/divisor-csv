name: Gerar Executavel Windows 7

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python (Compativel com Windows 7)
      uses: actions/setup-python@v5
      with:
        python-version: '3.8' # Mudança essencial para rodar no Win 7

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install pywin32 pyinstaller

    - name: Compilar o script em .exe
      run: |
        pyinstaller --noconsole --onefile converter.py

    - name: Guardar o arquivo .exe pronto
      uses: actions/upload-artifact@v4
      with:
        name: conversor-windows-exe
        path: dist/*.exe
